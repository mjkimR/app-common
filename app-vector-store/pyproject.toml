[project]
name = "app-vector-store"
version = "0.1.0"
description = "Vector database adapter package supporting Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-ai-catalog",
    "qdrant-client>=1.16.2",
    "langchain-qdrant>=1.1.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "dotenv>=0.9.9",
    "cachetools>=6.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_vector_store"]

[dependency-groups]
dev = [
    "fastapi>=0.115.12",
]

[tool.uv.sources]
app-ai-catalog = { workspace = true }

