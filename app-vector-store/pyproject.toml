[project]
name = "app-vector-store"
version = "0.1.0"
description = "Vector database adapter package supporting Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "app-ai-catalog",
    "qdrant-client>=1.16.2",
    "langchain-qdrant>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_vector_store"]

[tool.uv.sources]
app-layer-base = { workspace = true }
app-ai-catalog = { workspace = true }
