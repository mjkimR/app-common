[project]
name = "app-tools"
version = "0.1.0"
description = "app-common guides, rules, scaffolding and dependency updates as the `devkit app` command and the `app-common` devkit bundle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit>=0.1,<0.2",
    "click>=8.3.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
env-spec = ["app-layer-base", "app-file-storage", "app-prebuilt-auth", "app-vector-store"]

[tool.uv.sources]
app-layer-base = { workspace = true }
app-file-storage = { workspace = true }
app-prebuilt-auth = { workspace = true }
app-vector-store = { workspace = true }

[project.entry-points."devkit.commands"]
app = "app_tools.cli:cli"

[project.entry-points."devkit.bundles"]
app-common = "app_tools"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_tools"]

[tool.pytest.ini_options]
log_level = "INFO"
# "." keeps `tests.` importable; importlib mode lets every rule folder hold its own tests/test_rule.py.
pythonpath = ["src", "."]
# Rule tests live in each rule's folder (src/app_tools/bundle/rules/<slug>/tests/), as devkit deploys them.
testpaths = ["tests", "src"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
