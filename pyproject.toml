[tool.uv.workspace]
members = [
    "app-prebuilt-user",
    "app-prebuilt-outbox",
    "app-tools",
    "app-helper",
    "app-layer-base",
    "app-file-storage",
    "app-vector-store",
    "app-http-client",
    "app-ai-catalog",
]

[tool.rye.workspace]
members = [
    "app-prebuilt-user",
    "app-prebuilt-outbox",
    "app-tools",
    "app-helper",
    "app-layer-base",
    "app-file-storage",
    "app-vector-store",
    "app-http-client",
    "app-ai-catalog",
]

[tool.ruff]
exclude = [".git", ".venv", "migrations"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./app-prebuilt-user/src",
    "./app-prebuilt-outbox/src",
    "./app-tools/src",
    "./app-helper/src",
    "./app-layer-base/src",
    "./app-file-storage/src",
    "./app-vector-store/src",
    "./app-http-client/src",
    "./app-ai-catalog/src",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "app-layer-base",
    "app-layer-base/tests",
    "app-layer-base/tests/unit",
    "app-layer-base/tests/integrate",
    "app-prebuilt-user",
    "app-prebuilt-user/tests",
    "app-prebuilt-outbox",
    "app-file-storage",
    "app-vector-store",
    "app-http-client",
    "app-ai-catalog",
    "app-layer-base/src",
    "app-prebuilt-user/src",
    "app-prebuilt-outbox/src",
    "app-file-storage/src",
    "app-vector-store/src",
    "app-http-client/src",
    "app-ai-catalog/src",
]
