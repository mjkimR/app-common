[tool.uv.workspace]
members = [
    "packages/base/*",
    "packages/adapters/*",
    "packages/prebuilt/*",
    "tools/*",
]

[tool.rye.workspace]
members = [
    "packages/base/*",
    "packages/adapters/*",
    "packages/prebuilt/*",
    "tools/*",
]

[tool.ruff]
exclude = [".git", ".venv", "migrations"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/prebuilt/app-prebuilt-user/src",
    "./packages/prebuilt/app-prebuilt-outbox/src",
    "./tools/app-tools/src",
    "./packages/base/app-error/src",
    "./packages/base/app-layer-base/src",
    "./packages/base/app-testing-base/src",
    "./packages/adapters/app-file-storage/src",
    "./packages/adapters/app-vector-store/src",
    "./packages/adapters/app-http-client/src",
    "./packages/adapters/app-ai-catalog/src",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest-cov>=7.0.0",
]

# Each package owns its own pytest config (its `pythonpath = "src"` / `testpaths`), and
# `just test` runs one pytest per package from that package's directory. This table only
# applies to an ad-hoc `pytest` invoked from the repo root.
#
# There is deliberately no workspace-wide `pythonpath` here. Listing every package's
# directory made `tests` a single global top-level module name, so the one package with
# a `tests/__init__.py` silently won it for all the others -- app-prebuilt-user's
# conftest was importing app-layer-base's fixtures. Shared test code now lives in
# `app_layer_base.testing` and is loaded as a pytest plugin, not off `sys.path`.
[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage is driven by `just test-cov`, which runs pytest once per package from
# that package's own directory and points `--cov-config` back at this file.
# The measured source is therefore passed per-run as `--cov=src`, not set here.
[tool.coverage.run]
branch = true
# app_layer_base/testing ships in the wheel but is test scaffolding, not product code.
omit = ["*/tests/*", "*/app_layer_base/testing/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
