[tool.uv.workspace]
members = ["app-base", "app-tools"]

[tool.rye.workspace]
members = ["app-base", "app-tools"]

[tool.ruff]
exclude = [".git", ".venv", "migrations"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["./app-base/src", "./app-tools/src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
