[project]
name = "app-base"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.15.2",
    "apscheduler>=3.11.2",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "cachetools>=6.2.6",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "greenlet>=3.1.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.10.16",
    "passlib>=1.7.4",
    "pydantic-settings>=2.8.1",
    "pydantic[email]>=2.11.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.39",
    "uvicorn>=0.34.0",
    "app-layer-base",
    "app-file-storage",
    "app-nosql-db",
    "app-vector-store",
    "app-event-broker",
    "app-http-client",
    "app-ai-catalog",
]

[project.optional-dependencies]
s3 = ["app-file-storage"]
file_storage_all = ["app-file-storage"]
qdrant = ["app-vector-store"]
vector_db_all = ["app-vector-store"]
mongodb = ["app-nosql-db"]
firestore = ["app-nosql-db"]
nosql_db_all = ["app-nosql-db"]
rabbit = ["app-event-broker"]
redis = ["app-event-broker"]
event_all = ["app-event-broker"]
ai = ["app-ai-catalog"]
event = ["app-event-broker"]


[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
    "testcontainers[postgres]>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_base"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "src/tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_commit: use TRUNCATE strategy instead of savepoint rollback (allows real commits)",
]

[tool.uv.sources]
app-layer-base = { workspace = true }
app-file-storage = { workspace = true }
app-nosql-db = { workspace = true }
app-vector-store = { workspace = true }
app-event-broker = { workspace = true }
app-http-client = { workspace = true }
app-ai-catalog = { workspace = true }
