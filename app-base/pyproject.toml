[project]
name = "app-base"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.15.2",
    "apscheduler>=3.11.2",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "cachetools>=6.2.6",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "greenlet>=3.1.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.10.16",
    "passlib>=1.7.4",
    "pydantic-settings>=2.8.1",
    "pydantic[email]>=2.11.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.39",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
# file storage
s3 = ["aiobotocore>=3.1.1"]
file_storage_all = ["app-base[s3]"]
# vector databases
qdrant = ["app-base[ai]", "qdrant-client>=1.16.2", "langchain-qdrant>=1.1.0"]
vector_db_all = ["app-base[qdrant]"]
# nosql databases
mongodb = ["motor>=3.1.1"]
firestore = ["google-cloud-firestore>=2.11.0"]
nosql_db_all = ["app-base[mongodb,firestore]"]
# Event broker specific
rabbit = ["app-base[event]", "faststream[rabbit]>=0.6.6"]
redis = ["app-base[event]", "faststream[redis]>=0.6.6"]
event_all = ["app-base[rabbit,redis]"]
# feature set
ai = ["langchain-core>=1.2.7", "langgraph>=1.0.7", "litellm>=1.80.0"]
event = ["faststream>=0.6.6"]


[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
    "testcontainers[postgres]>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_base"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "src/tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_commit: use TRUNCATE strategy instead of savepoint rollback (allows real commits)",
]
