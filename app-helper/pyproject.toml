[project]
name = "app-helper"
version = "0.1.0"
description = "General-purpose developer helper tools and utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.3.1"]

[project.scripts]
app-helper = "app_helper.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_helper"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "src/tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
