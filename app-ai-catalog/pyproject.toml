[project]
name = "app-ai-catalog"
version = "0.1.0"
description = "AI catalog package supporting LLMs and embedding factory models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "langchain-core>=1.2.7",
    "langgraph>=1.0.7",
    "litellm>=1.80.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_ai_catalog"]

[tool.uv.sources]
app-layer-base = { workspace = true }

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"
