[project]
name = "app-tools"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "polyfactory>=3.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_tools"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "src/tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
