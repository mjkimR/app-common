name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci
        with:
          python-version: '3.13'

      # `just init-dev` ran `devkit sync`; a committed receipt or projection it had to change
      # means a bundle source was edited without `just sync-agents`.
      - name: Check deployed devkit bundles
        run: |
          changed=$(git status --porcelain -- .devkit AGENTS.md .agents/skills .claude/skills)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Bundle sources changed without a sync: run 'just sync-agents' and commit the result." >&2
            exit 1
          fi

      - name: Run Lint
        run: |
          just lint-check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci
        with:
          python-version: '3.13'

      - name: Run Pyright
        run: |
          just check

  test:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            test-command: test
          - name: PostgreSQL
            test-command: test-pg
          - name: Docker backends
            test-command: test-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci
        with:
          python-version: '3.13'

      - name: Run Tests
        run: |
          just ${{ matrix.test-command }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, type-check, test]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
