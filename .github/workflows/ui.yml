name: Frontend tooling

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  eslint-config:
    name: Check and test @app-common/eslint-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
  api-codegen-template:
    name: Check and test the API codegen template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/api-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/api-codegen/package-lock.json
      - name: Install shared lint tooling
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
