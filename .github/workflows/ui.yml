name: UI package

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/app-ui-base/**"
      - "packages/tooling/eslint-config/**"
      - "package.json"
      - "package-lock.json"
      - "justfile"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ui/app-ui-base/**"
      - "packages/tooling/eslint-config/**"
      - "package.json"
      - "package-lock.json"
      - "justfile"
      - ".github/workflows/ui.yml"

jobs:
  check-and-build:
    name: Check and build @app-common/ui-base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui/app-ui-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/ui/app-ui-base/package-lock.json
      - name: Install shared lint tooling
        run: npm ci
        working-directory: .
      - name: Test shared file-size policy
        run: |
          npm run check
          npm test
        working-directory: .
      - name: Install dependencies
        run: npm ci
      - name: Check file sizes
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Build package
        run: npm run build
