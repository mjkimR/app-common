name: Setup CI Environment
description: Set up Python, uv cache, just, and initialize the workspace.
inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.13'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Just
      shell: bash
      run: |
        ./scripts/install-just.sh

    - name: Initialize Project
      shell: bash
      run: |
        just init-dev

