[project]
name = "app-nosql-db"
version = "0.1.0"
description = "NoSQL database adapter package supporting MongoDB and Firestore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "motor>=3.1.1",
    "google-cloud-firestore>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_nosql_db"]

[tool.uv.sources]
app-layer-base = { workspace = true }
