[project]
name = "app-nosql-db"
version = "0.1.0"
description = "NoSQL database adapter package supporting MongoDB and Firestore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "motor>=3.1.1",
    "google-cloud-firestore>=2.11.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_nosql_db"]

[dependency-groups]
dev = [
    "fastapi>=0.115.12",
]

