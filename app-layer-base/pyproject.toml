[project]
name = "app-layer-base"
version = "0.1.0"
description = "Core layer base containing models, repos, services, usecases and configs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.39",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "orjson>=3.10.16",
    "greenlet>=3.1.1",
]

# `app_layer_base.testing` -- pytest fixtures and DI helpers for anything built on this
# package. Not imported by the library itself, so these stay out of the base install.
[project.optional-dependencies]
testing = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "testcontainers[postgres]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_layer_base"]

[dependency-groups]
dev = [
    "app-layer-base[testing]",
]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# tests/unit carries the shared `test_layer_base.mock_models` package. `tests` itself is
# deliberately absent: making it importable is what let one package's tests/ shadow
# another's across the workspace.
pythonpath = ["tests/unit", "src"]

