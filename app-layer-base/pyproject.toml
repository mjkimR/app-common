[project]
name = "app-layer-base"
version = "0.1.0"
description = "Core layer base containing models, repos, services, usecases and configs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.39",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "orjson>=3.10.16",
    "greenlet>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_layer_base"]
