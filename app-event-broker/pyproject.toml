[project]
name = "app-event-broker"
version = "0.1.0"
description = "Event broker adapter package supporting RabbitMQ and Redis via FastStream"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faststream>=0.6.6",
    "faststream[rabbit]>=0.6.6",
    "faststream[redis]>=0.6.6",
    "loguru>=0.7.3",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_event_broker"]

[dependency-groups]
dev = [
    "fastapi>=0.115.12",
]

