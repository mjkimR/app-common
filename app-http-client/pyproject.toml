[project]
name = "app-http-client"
version = "0.1.0"
description = "HTTP Client adapter package based on httpx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_http_client"]

[dependency-groups]
dev = [
    "fastapi>=0.115.12",
]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"
