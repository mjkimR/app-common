[project]
name = "app-http-client"
version = "0.1.0"
description = "HTTP Client adapter package based on httpx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_http_client"]

[tool.uv.sources]
app-layer-base = { workspace = true }
