[project]
name = "app-prebuilt-outbox"
version = "0.1.0"
description = "Prebuilt domain event outbox library for app-common"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "apscheduler>=3.11.2",
    "sqlalchemy>=2.0.39",
]

[dependency-groups]
dev = [
    "app-layer-base[testing]",
    "fastapi>=0.115.12",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_prebuilt_outbox"]

[tool.uv.sources]
app-layer-base = { workspace = true }
