[project]
name = "app-testing-base"
version = "0.1.0"
description = "FastAPI, SQLAlchemy, and Pytest testing foundation for app-common and downstream services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "testcontainers[postgres]>=4.8.0",
    "orjson>=3.10.16",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_testing_base"]

[tool.uv.sources]
app-layer-base = { workspace = true }

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
