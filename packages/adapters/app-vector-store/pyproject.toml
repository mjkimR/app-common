[project]
name = "app-vector-store"
version = "0.1.0"
description = "Vector database adapter package supporting Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.16.2",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_vector_store"]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"
markers = ["docker: requires a real Qdrant container"]
