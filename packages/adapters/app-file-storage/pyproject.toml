[project]
name = "app-file-storage"
version = "0.1.0"
description = "File storage adapter package supporting local and S3 storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiobotocore>=3.1.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_file_storage"]

[dependency-groups]
dev = [
    "fastapi>=0.115.12",
    "testcontainers>=4.8.0",
]

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"
markers = [
    "docker: needs a Docker daemon to start a real backend; deselected by default, run with `just test-docker`",
]
