[project]
name = "app-document-store"
version = "0.1.0"
description = "Async document storage with Firestore and optimistic concurrency"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-firestore>=2.21.0,<3",
    "pydantic-settings>=2.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_document_store"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "testcontainers>=4.8.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = ["tests"]
markers = ["docker: requires a real Firestore emulator (external or container)"]
