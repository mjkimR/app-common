[project]
name = "app-prebuilt-google-auth"
version = "0.1.0"
description = "Google OIDC login with shared account approval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["app-layer-base", "app-prebuilt-user", "app-http-client", "pyjwt[crypto]>=2.10.1"]

[dependency-groups]
dev = ["app-testing-base", "pytest-mock>=3.15.0", "python-multipart>=0.0.7"]

[tool.uv.sources]
app-layer-base = { workspace = true }
app-prebuilt-user = { workspace = true }
app-http-client = { workspace = true }
app-testing-base = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_prebuilt_google_auth"]
