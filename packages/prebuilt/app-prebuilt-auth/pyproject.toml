[project]
name = "app-prebuilt-auth"
version = "0.1.0"
description = "Complete user, Google OIDC, approval, session, and machine-key authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-layer-base",
    "app-http-client",
    "fastapi>=0.115.12",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0.39",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = ["app-testing-base", "pytest-mock>=3.15.0", "ruff>=0.14.14"]

[tool.uv.sources]
app-layer-base = { workspace = true }
app-http-client = { workspace = true }
app-testing-base = { workspace = true }

[tool.pytest.ini_options]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = "tests"
markers = ["real_commit: allow real transactions for HTTP and concurrency tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_prebuilt_auth"]
