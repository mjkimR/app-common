[project]
name = "app-prebuilt-search"
version = "0.1.0"
description = "DB-backed semantic search and explicit incremental indexing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["app-error", "app-layer-base", "app-vector-store", "sqlalchemy>=2.0.39", "pydantic>=2.11.1", "qdrant-client>=1.16.2"]

[project.optional-dependencies]
fastembed = ["fastembed>=0.7.0"]

[dependency-groups]
dev = ["app-testing-base", "pytest-mock>=3.15.0", "ruff>=0.14.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_prebuilt_search"]

[tool.uv.sources]
app-error = { workspace = true }
app-layer-base = { workspace = true }
app-vector-store = { workspace = true }
app-testing-base = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "src"
testpaths = ["tests"]
markers = ["docker: requires a real Qdrant container"]
